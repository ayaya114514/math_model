# 阶段 7-1：本地同家族老师的序列级蒸馏（Qwen2.5-Math-7B-Instruct 4-bit）
# 与 self_rft.yaml 只差"谁来解题"：题目、顺序、采样参数、筛选规则、训练条数都相同
# 老师和学生的词表 / chat template 完全一致（已验证），写法天然接近学生
seed: 42
model: mlx-community/Qwen2.5-Math-7B-Instruct-4bit     # 生成用：老师
student_model: mlx-community/Qwen2.5-1.5B-Instruct-bf16  # 构建时按学生 tokenizer 计算长度
system_prompt: "Please reason step by step, and put your final answer within \\boxed{}."   # 与评测一致

question_source: data/filtered/gsm8k_human     # 读取 valid.jsonl 和 train_7000.jsonl（保持原顺序）
n_train_questions: 2600     # 老师正确率约 95%，1 次采样即可凑出 2000 道
samples_per_question: 1     # 老师强，每题 1 次；学生不会的难题也能拿到正确解答（self-RFT 排除了它们）
# 采样参数与 self_rft.yaml 相同（Qwen2.5 官方 generation_config）
temperature: 0.7
top_p: 0.8
top_k: 20
max_tokens: 1024
batch_size: 64
chunk_questions: 64         # 64 题 × 1 采样 = 64 条，等于 batch_size

out_dir: data/generated/teacher_math7b
# 构建训练数据：与阶段 3 / self_rft 相同的格式过滤和长度上限
arm: teacher_math7b
dataset: teacher-RFT
teacher: Qwen2.5-Math-7B-Instruct-4bit (local, rejection-sampled)
report: results/stage7/teacher_math7b_build.json
train_size: 2000
max_total_tokens: 1024
decontam_config: configs/decontam.yaml
